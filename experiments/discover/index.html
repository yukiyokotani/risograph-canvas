<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Discover scoring validation</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #141414; color: #ddd; }
      header { padding: 10px 14px; border-bottom: 1px solid #333; font-size: 13px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; padding: 14px; }
      .card { border: 1px solid #333; border-radius: 8px; overflow: hidden; background: #1b1b1b; }
      .card.ok { border-color: #2e7d52; }
      .card.bad { border-color: #7d2e2e; }
      canvas { display: block; width: 100%; image-rendering: auto; background:#000; }
      .meta { padding: 6px 8px; font-size: 11px; line-height: 1.5; font-variant-numeric: tabular-nums; }
      .name { font-weight: 600; color: #cbd; }
      .swatches { display:flex; gap:3px; margin:3px 0; }
      .sw { width:12px; height:12px; border-radius:3px; border:1px solid #0004; }
      .verdict { font-weight:700; }
      .verdict.ok { color:#6bd69b; } .verdict.bad { color:#e58a8a; }
      select { background:#222;color:#ddd;border:1px solid #444;border-radius:4px;padding:3px 6px; }
    </style>
  </head>
  <body>
    <header>
      Discover 採点検証 — 各候補を小サムネで描画し、structure / separation / category を採点。
      「良い候補」と「悪い候補」で点差がつくかを見る。
      画像 <select id="img"><option value="synthetic">合成カラフル</option><option value="/sample.jpg">sample.jpg</option></select>
      <span id="status"></span>
    </header>
    <div class="grid" id="grid"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
