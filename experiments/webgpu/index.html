<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebGPU stencil parity experiment</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #ddd; }
      header { padding: 12px 16px; border-bottom: 1px solid #333; }
      h1 { font-size: 15px; margin: 0 0 4px; }
      #status { font-size: 12px; color: #9ae; white-space: pre-wrap; }
      #metrics { font-size: 12px; color: #ec9; margin-top: 6px; font-variant-numeric: tabular-nums; }
      .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 16px; }
      .cell { border: 1px solid #333; border-radius: 6px; overflow: hidden; }
      .cell h2 { font-size: 12px; margin: 0; padding: 6px 8px; background: #1c1c1c; color: #bbb; font-weight: 600; }
      canvas { display: block; width: 100%; image-rendering: pixelated; background: #000; }
      .controls { padding: 8px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 12px; }
      select, button { background: #222; color: #ddd; border: 1px solid #444; border-radius: 4px; padding: 4px 8px; font-size: 12px; }
    </style>
  </head>
  <body>
    <header>
      <h1>WebGPU stencil parity experiment</h1>
      <div id="status">initializing…</div>
      <div id="metrics"></div>
    </header>
    <div class="controls">
      <label>preset
        <select id="preset">
          <option value="tricolor">Tricolor (B+R+Y)</option>
          <option value="cmyk">CMYK (B+R+Y+K)</option>
          <option value="classic">Classic (Blue+Red)</option>
          <option value="mono-black">Mono Black</option>
          <option value="mono-red">Mono Red</option>
          <option value="mono-blue">Mono Blue</option>
          <option value="pink-blue">Fl.Pink + Mid.Blue (2-ink Natural)</option>
        </select>
      </label>
      <label>mode
        <select id="mode">
          <option value="am">Dot Size (AM)</option>
          <option value="fm">Dot Density (FM)</option>
        </select>
      </label>
      <label>dotSize <select id="dot"><option>3</option><option>4</option><option>6</option><option>2</option></select></label>
      <label>size
        <select id="size">
          <option value="480">480px</option>
          <option value="600" selected>600px (preview)</option>
          <option value="1200">1200px (2x)</option>
          <option value="2400">2400px (4x)</option>
        </select>
      </label>
      <label><input type="checkbox" id="skipcpu" /> skip CPU (GPUのみ計測)</label>
      <label><input type="checkbox" id="gpudecomp" /> GPU 分解 (直接移植の検証)</label>
      <label>paper
        <select id="paper">
          <option value="#f5f0e8">Cream</option>
          <option value="#1a1a1a">Black</option>
        </select>
      </label>
      <label>cutoff
        <select id="cutoff">
          <option value="0">0</option>
          <option value="0.15">0.15</option>
          <option value="0.3">0.3</option>
        </select>
      </label>
      <label>effects
        <select id="fx">
          <option value="off">off (core only)</option>
          <option value="on">on (misreg+grain+noise+texture)</option>
        </select>
      </label>
      <button id="run">Re-run</button>
    </div>
    <div class="grid">
      <div class="cell"><h2>CPU (computeStencil) — reference</h2><canvas id="cpu"></canvas></div>
      <div class="cell"><h2>WebGPU</h2><canvas id="gpu"></canvas></div>
      <div class="cell"><h2>diff ×8 (|CPU − GPU|)</h2><canvas id="diff"></canvas></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
